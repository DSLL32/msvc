[package]
name = "recon-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
libloading = "0.8"
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
