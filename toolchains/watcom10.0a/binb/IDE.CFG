  Action &Run...
    Command "$\"Command:\""
    Hint "Execute Command"
  Action "Run Ba&tch..."
    Command "!Batch $\"Command:\""
    Hint "Execute Command"
  Action "&Edit Text..."
    Command "!Editor EditFile $\"Filename:==\""
    Hint "Invoke editor"


  ToolItem 1009 Source  &Edit*  "Edit the selected source file"
