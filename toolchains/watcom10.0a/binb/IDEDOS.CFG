Project
    TargetGroup "16-bit DOS"
      Target *.exe, de6e_, "Executable"
      Target *.com, dc6e_, ".COM Executable"
      Target *.lib, d_6s_, "Library"
    TargetGroup "32-bit DOS"
      Target *.exe, dr2e_, "DOS4GW Executable"
      Target *.exp, dp2e_, "Pharlap Executable"
      Target *.exe, dt2e_, "Pharlap TNT Executable"
      Target *.exe, df2e_, "Flashtek Executable"
      Target *.exe, ds2e_, "Flashtek -- Stack based"
      Target *.lib, d_2s_, "Library"
